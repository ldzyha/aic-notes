name: publish-vscode-marketplace

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing stable GitHub release tag
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable GitHub release tag (vN.N.N)
        required: true
        type: string
      verification_only:
        description: Verify release assets without publishing to Marketplace
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: vscode-marketplace-ldzyha-aic-notes
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ldzyha/aic-notes' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      VSCE_AUTH_MODE: ${{ vars.VSCE_AUTH_MODE || 'pat' }}
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
          cache: npm
      - run: npm ci
      - name: Validate release tag
        run: |
          node --input-type=module -e 'import { validateReleaseTag } from "./scripts/verify-marketplace-release.mjs"; validateReleaseTag(process.env.RELEASE_TAG);'
      - name: Download and verify the existing GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_DIRECTORY="$RUNNER_TEMP/marketplace-release"
          mkdir -p "$RELEASE_DIRECTORY"
          ASSET_NAME="aic-notes-${RELEASE_TAG#v}.vsix"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > "$RELEASE_DIRECTORY/release.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RELEASE_DIRECTORY" --pattern "$ASSET_NAME" --pattern "$ASSET_NAME.sha256"
          node scripts/verify-marketplace-release.mjs \
            "$RELEASE_TAG" "$RELEASE_DIRECTORY/release.json" "$RELEASE_DIRECTORY"
          echo "vsix_path=$RELEASE_DIRECTORY/$ASSET_NAME" >> "$GITHUB_OUTPUT"
      - name: Validate publishing authentication choice
        if: ${{ inputs.verification_only != true }}
        run: |
          case "$VSCE_AUTH_MODE" in pat|entra) ;; *)
            echo "::error::VSCE_AUTH_MODE must be pat or entra."
            exit 1 ;;
          esac
      - name: Login with the authorized Entra federated identity
        if: ${{ inputs.verification_only != true && vars.VSCE_AUTH_MODE == 'entra' }}
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.VSCE_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.VSCE_AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Verify publisher access and submit the verified VSIX
        if: ${{ inputs.verification_only != true }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          AZURE_CLIENT_ID: ${{ vars.VSCE_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.VSCE_AZURE_TENANT_ID }}
        run: |
          node scripts/publish-marketplace.mjs "$RELEASE_TAG" \
            "$RUNNER_TEMP/marketplace-release/release.json" "$RUNNER_TEMP/marketplace-release"
