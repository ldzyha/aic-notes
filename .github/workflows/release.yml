name: release-gate

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.1
          cache-dependency-path: bridge/go.sum
      - name: Verify tag and R.F.B version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require(`./package.json`).version')"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test and build pinned Standard Notes bridge
        working-directory: bridge
        run: |
          go test ./...
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o ../bin/linux-x64/aic-notes-sn-bridge .
      - run: npm run package
      - run: npm run package:windows
      - run: npm run release:verify
